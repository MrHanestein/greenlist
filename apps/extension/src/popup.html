<!doctype html><html lang="en"><meta charset="utf-8"><title>Greenlist connection</title><style>body{width:300px;padding:20px;font:14px/1.5 system-ui;color:#173e2e}input,select,button{box-sizing:border-box;width:100%;padding:10px;margin:7px 0;border:1px solid #bacbbd;border-radius:8px}button{background:#176b43;color:white;cursor:pointer}a{color:#176b43}</style><h2>Greenlist Autofill</h2><p id="status" role="status"></p><p>Generate a seven-day connection token in <a id="accountLink" href="http://localhost:3000/dashboard?tab=account" target="_blank" rel="noreferrer">Account</a>.</p><label>App<select id="baseUrl"><option value="http://localhost:3000">Local development</option></select></label><label>Connection token<input id="tokenInput" type="password" autocomplete="off"></label><button id="saveToken">Connect</button><button id="signOut">Disconnect</button><p>Greenhouse and Lever only. Workday is not supported.</p><script src="config.js"></script><script src="popup.js"></script></html>
